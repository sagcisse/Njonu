<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap" rel="stylesheet">

    <style>
        /* --- الألوان والثيمات المختلفة --- */
        :root {
            /* الثيم الافتراضي: داكن شفاف */
            --bg-transparent: rgba(30, 30, 30, 0.70);
            --border-light: rgba(255, 255, 255, 0.2); 
            --text-white: #ffffff;
            --accent-color: #ff3b30;
            --window-bg: rgba(0, 0, 0, 0.45);
            --scale: 1; 
        }

        /* ثيم 1: الذهبي الأثري (Gold Edition) */
        body.theme-gold {
            --bg-transparent: rgba(40, 32, 15, 0.85);
            --border-light: rgba(230, 180, 80, 0.5);
            --text-white: #fbe3b5;
            --accent-color: #ffd700;
            --window-bg: rgba(20, 15, 5, 0.6);
        }

        /* ثيم 2: الزمرد الملكي (Emerald) */
        body.theme-emerald {
            --bg-transparent: rgba(10, 35, 25, 0.85);
            --border-light: rgba(80, 220, 150, 0.4);
            --text-white: #e0f8ed;
            --accent-color: #2ecc71;
            --window-bg: rgba(5, 20, 15, 0.6);
        }

        /* ثيم 3: الأزرق الملكي (Royal Blue) */
        body.theme-blue {
            --bg-transparent: rgba(15, 25, 45, 0.85);
            --border-light: rgba(100, 160, 255, 0.4);
            --text-white: #e3efff;
            --accent-color: #007aff;
            --window-bg: rgba(5, 10, 25, 0.6);
        }

        /* ثيم 4: العنابي الياقوتي (Crimson Red) */
        body.theme-crimson {
            --bg-transparent: rgba(45, 15, 20, 0.85);
            --border-light: rgba(255, 100, 120, 0.4);
            --text-white: #ffe8eb;
            --accent-color: #ff2d55;
            --window-bg: rgba(25, 5, 10, 0.6);
        }

        /* ثيم 5: الأرجواني الساطع (Neon Purple) */
        body.theme-purple {
            --bg-transparent: rgba(30, 15, 45, 0.85);
            --border-light: rgba(180, 100, 255, 0.4);
            --text-white: #f3e5ff;
            --accent-color: #af52de;
            --window-bg: rgba(15, 5, 25, 0.6);
        }

        html, body {
            background-color: transparent !important; 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'ADLaM Display', serif;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent; 
            transition: all 0.4s ease;
        }

        .widget-wrapper {
            transform-origin: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock-container {
            position: relative;
            width: 320px; 
            height: 320px;
            flex-shrink: 0;
            background-color: var(--bg-transparent);
            border-radius: 50%;
            border: 2px solid var(--border-light); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .clock-container::before {
            content: '';
            position: absolute;
            width: 88%;
            height: 88%;
            border-radius: 50%;
            border: 1px dashed var(--border-light);
        }

        .day-window {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--window-bg);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--text-white);
            z-index: 5;
            text-align: center;
            white-space: nowrap;
        }

        .date-window {
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--window-bg);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 6px 14px;
            color: var(--text-white);
            z-index: 5;
            text-align: center;
            white-space: nowrap;
        }

        .date-text {
            font-size: 12.5px;
            line-height: 1.3;
        }

        .digital-clock {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: var(--text-white);
            padding-top: 15px;
            box-sizing: border-box;
            user-select: none;
        }

        .number span { display: inline-block; }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            z-index: 10;
        }

        .hour-hand {
            width: 5px;
            height: 25%;
            background-color: var(--text-white);
            transform: translateX(-50%);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .minute-hand {
            width: 3.5px;
            height: 35%;
            background-color: var(--text-white);
            transform: translateX(-50%);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .second-hand {
            width: 2px;
            height: 40%;
            background-color: var(--accent-color);
            transform: translateX(-50%);
            z-index: 15;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            border: 2px solid #222;
        }

        /* زر التغيير السريع للألوان عند النقر على الساعة */
        .color-toggle-btn {
            position: absolute;
            bottom: 12px;
            font-size: 10px;
            color: var(--border-light);
            background: rgba(0,0,0,0.3);
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="widget-wrapper" id="wrapper">
        <div class="clock-container" id="clock" onclick="nextTheme()">
            <div class="day-window" id="day-window"></div>
            
            <div class="date-window" id="date-window">
                <div class="date-text" id="date-text"></div>
                <div class="digital-clock" id="digital-clock"></div>
            </div>
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
            <div class="center-dot"></div>
            <div class="color-toggle-btn">اضغط لتغيير اللون</div>
        </div>
    </div>

    <script>
        // دالة تغيير الثيمات والألوان
        const themes = ['', 'theme-gold', 'theme-emerald', 'theme-blue', 'theme-crimson', 'theme-purple'];
        let currentThemeIndex = 0;

        function nextTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            setTheme(themes[currentThemeIndex]);
        }

        function setTheme(themeName) {
            document.body.className = themeName;
        }

        function autoResizeClock() {
            const wrapper = document.getElementById('wrapper');
            const width = document.documentElement.clientWidth || window.innerWidth || document.body.clientWidth;
            const height = document.documentElement.clientHeight || window.innerHeight || document.body.clientHeight;
            const availableSpace = Math.min(width, height);
            const scaleFactor = (availableSpace * 0.85) / 320;
            wrapper.style.transform = `scale(${scaleFactor})`;
        }

        window.addEventListener('resize', autoResizeClock);
        window.addEventListener('load', autoResizeClock);
        autoResizeClock();

        const customNumbers = ['𞥑𞥒', '𞥑', '𞥒', '𞥓', '𞥔', '𞥕', '𞥖', '𞥗', '𞥘', '𞥙', '𞥑𞥐', '𞥑𞥑'];
        const adlamDigits = ['𞥐', '𞥑', '𞥒', '𞥓', '𞥔', '𞥕', '𞥖', '𞥗', '𞥘', '𞥙'];
        
        function toAdlamNumber(num) {
            return num.toString().split('').map(char => {
                const digit = parseInt(char);
                return isNaN(digit) ? char : adlamDigits[digit];
            }).join('');
        }

        function toAdlamUpperCase(text) {
            return [...text].map(char => {
                const code = char.codePointAt(0);
                if (code >= 0x1E922 && !(code >= 0x1E944)) {
                    return String.fromCodePoint(code - 0x22);
                }
                return char;
            }).join('');
        }

        const fulaniMonths = [
            '𞤅𞤭𞥅𞤤𞤮', '𞤕𞤮𞤤𞤼𞤫', '𞤃𞤦𞤮𞥅𞤴', '𞤅𞤫𞥅𞤯𞤼𞤮', 
            '𞤁𞤵𞥅𞤶𞤢𞤤', '𞤑𞤮𞤪𞤧𞤫', '𞤃𞤮𞤪𞤧𞤮', '𞤔𞤵𞤳𞤮', 
            '𞤅𞤭𞥅𞤤𞤼𞤮', '𞤒𞤢𞤪𞤳𞤮𞤥𞤢𞥅', '𞤔𞤮𞤤𞤢𞤤', '𞤄𞤮𞤱𞤼𞤫'
        ];

        const fulaniDays = [
            '𞤀𞤤𞤢𞤤', '𞤀𞤤𞤼𞤭𞤲𞤫', '𞤚𞤢𞤤𞤢𞥄𞤼𞤢', '𞤀𞤤𞤢𞤪𞤦𞤢', 
            '𞤀𞤤𞤳𞤢𞤥𞤭𞤧𞤢', '𞤀𞤤𞤶𞤵𞤥𞤢', '𞤀𞤧𞤫𞤱𞤫'
        ];

        const clock = document.getElementById('clock');
        const dayTextEl = document.getElementById('day-window');
        const dateTextEl = document.getElementById('date-text');
        const digitalClockEl = document.getElementById('digital-clock');

        customNumbers.forEach((num, index) => {
            const numDiv = document.createElement('div');
            numDiv.className = 'number';
            const angle = index * 30;
            numDiv.style.transform = `rotate(${angle}deg)`;
            const span = document.createElement('span');
            span.innerText = num;
            span.style.transform = `rotate(-${angle}deg)`;
            numDiv.appendChild(span);
            clock.insertBefore(numDiv, clock.firstChild);
        });

        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');
        let lastDateString = ""; 

        function updateClock() {
            const now = new Date();
            const dayNum = now.getDate();
            const monthIdx = now.getMonth();
            const yearNum = now.getFullYear();
            const dayOfWeekIdx = now.getDay(); 

            const adlamDay = toAdlamNumber(dayNum);
            const monthName = toAdlamUpperCase(fulaniMonths[monthIdx]);
            const currentDayName = toAdlamUpperCase(fulaniDays[dayOfWeekIdx]);
            const adlamYear = toAdlamNumber(yearNum);

            const currentDateString = `${adlamDay} ${monthName} ${adlamYear}`;
            
            if (currentDateString !== lastDateString) {
                dateTextEl.innerText = currentDateString;
                dayTextEl.innerText = currentDayName;
                lastDateString = currentDateString;
            }

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const formatDigits = (n) => (n < 10 ? '𞥐' + toAdlamNumber(n) : toAdlamNumber(n));
            digitalClockEl.innerText = `${formatDigits(hours)} : ${formatDigits(minutes)} : ${formatDigits(seconds)}`;

            const millis = now.getMilliseconds();
            const secondsDegrees = ((seconds + (millis / 1000)) / 60) * 360;
            const minutesDegrees = ((minutes + (seconds / 60)) / 60) * 360;
            const hoursDegrees = ((hours % 12 + (minutes / 60)) / 12) * 360;

            secondHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;

            requestAnimationFrame(updateClock);
        }

        updateClock();
    </script>
</body>
</html>
