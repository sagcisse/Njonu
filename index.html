<!DOCTYPE html>
<html lang="ff" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>𞤅𞤢𞤢𞤼𞤫 𞤆𞤵𞤤𞤢𞤪 - Antique Clock</title>
    <style>
        @font-face {
            font-family: 'ADLaM Display';
            src: url('https://cdn.jsdelivr.net/npm/@google/font-adlam@1.0.0/fonts/ADLaMDisplay-Regular.woff2') format('woff2');
        }
        body {
            background-color: #1a120b;
            color: #d4af37;
            font-family: 'ADLaM Display', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock-container {
            background: radial-gradient(circle, #3b2716 0%, #1f140a 100%);
            border: 8px solid #8c6747;
            border-radius: 50%;
            width: 480px;
            height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
            position: relative;
        }
        .time {
            font-size: 3.2rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 10px 0;
        }
        .date {
            font-size: 1.3rem;
            margin-top: 15px;
            color: #c5a059;
            text-align: center;
            padding: 0 20px;
        }
        .title {
            position: absolute;
            top: 50px;
            font-size: 1.1rem;
            color: #a67c52;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="title">𞤅𞤢𞤢𞤼𞤫 𞤆𞤵𞤤𞤢𞤪</div>
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="date">--</div>
    </div>

    <script>
        // أسماء الأيام باللغة الفولانية (Pulaar) بخط أدلام
        const fulaniDays = [
            '𞤈𞤫𞤦𞤭𞤪𞥆𞤫', '𞤀𞥄𞤩𞤵𞤲\'𞤣𞤫', '𞤃𞤢𞤱𞤦𞤢𞥄𞤪𞤫', '𞤐𞤶𞤫𞤧𞤤𞤢𞥄𞤪𞤫', 
            '𞤐𞤢𞥄𞤧𞤢𞥄𞤲\'𞤣𞤫', '𞤃𞤢𞤱𞤲𞤣𞤫', '𞤖𞤮𞤪𞤦𞤭𞤪𞥆𞤫'
        ];

        // أسماء الأشهر باللغة الفولانية (Pulaar) بخط أدلام (تم تصحيح الأخطاء والرموز التالفة)
        const fulaniMonths = [
            '𞤅𞤭𞥅𞤤𞤮', '𞤕𞤮𞤤𞤼𞤫', '𞤃𞤦𞤮𞥅𞤴', '𞤅𞤫𞥅𞤯𞤼𞤮', 
            '𞤁𞤵𞥅𞤶𞤢𞤤', '𞤑𞤮𞤪𞤧𞤫', '𞤃𞤮𞤪𞤧𞤮', '𞤔𞤵𞤳𞤮', 
            '𞤅𞤭𞥅𞤤𞤼𞤮', '𞤒𞤢𞤪𞤳𞤮𞤥𞤢𞥅', '𞤔𞤮𞤤𞤢𞤤', '𞤄𞤮𞤱𞤼𞤫'
        ];

        // الأرقام بنظام أدلام (0-9)
        const fulaniDigits = ['𞥐', '𞥑', '𞥒', '𞥓', '𞥔', '𞥕', '𞥖', '𞥗', '𞥘', '𞥙'];

        function toAdlamNumber(num) {
            return num.toString().split('').map(d => fulaniDigits[parseInt(d)] || d).join('');
        }

        function padZero(num) {
            return num < 10 ? fulaniDigits[0] + toAdlamNumber(num) : toAdlamNumber(num);
        }

        function updateClock() {
            const now = new Date();
            
            const hours = padZero(now.getHours());
            const minutes = padZero(now.getMinutes());
            const seconds = padZero(now.getSeconds());

            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const dayName = fulaniDays[now.getDay()];
            const monthName = fulaniMonths[now.getMonth()];
            const dayNum = toAdlamNumber(now.getDate());
            const yearNum = toAdlamNumber(now.getFullYear());

            document.getElementById('date').innerText = `${dayName}، ${dayNum} ${monthName} ${yearNum}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
